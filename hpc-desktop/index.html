<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HPC Center — Health & Pain Care Center</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Minimalist Top Bar -->
      <header class="app-header">
        <div class="brand-mini">
          <img src="/hpclogo.jpg" class="brand-mini-logo" alt="HPC Logo" />
          <span class="brand-mini-title">HPC Center</span>
        </div>
        <button id="btn-manual-ip" class="btn-icon" title="Server Settings" aria-label="Settings">
          ⚙️
        </button>
      </header>

      <!-- Center Splash & Auto-Discovery View -->
      <main class="scanner-container">
        <div class="scanner-card">
          <!-- Logo with Radar Pulse Glow -->
          <div class="logo-wrapper">
            <div class="radar-pulse"></div>
            <img src="/hpclogo.jpg" class="center-logo" alt="HPC Center" />
          </div>

          <!-- Title & Subtitle -->
          <h1 class="main-title">Health & Pain Care Center</h1>
          <p class="main-subtitle">Universal Clinic System</p>

          <!-- Live Network Scanning Status -->
          <div id="network-badge" class="network-badge searching">
            <span class="status-dot"></span>
            <span id="network-status-text">Scanning Clinic Network...</span>
            <span id="latency-pill" class="latency-pill hidden">0ms</span>
          </div>

          <!-- Connection Details / Progress Subtext -->
          <p id="progress-subtext" class="progress-subtext">
            Searching via UDP broadcast & local subnet sweep...
          </p>

          <!-- Offline / Retry Controls (Shown only if server not found) -->
          <div id="offline-actions" class="offline-actions hidden">
            <button id="btn-rescan" class="btn-primary">
              🔄 Retry LAN Scan
            </button>
            <button id="btn-manual-ip-alt" class="btn-secondary">
              ⚙️ Enter Server IP
            </button>
          </div>
        </div>
      </main>

      <!-- Server Settings Modal -->
      <div id="modal-settings" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-header">
            <h3>Server Configuration</h3>
            <button id="btn-close-modal" class="btn-close">&times;</button>
          </div>
          <div class="modal-body">
            <p class="modal-hint">
              If auto-discovery is blocked by your router's firewall or client isolation, enter the clinic server IP directly:
            </p>
            <div class="form-group">
              <label for="input-server-ip">Server IP / Hostname</label>
              <input type="text" id="input-server-ip" placeholder="e.g. 192.168.x.x" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="input-server-port">Port</label>
                <input type="number" id="input-server-port" value="3000" />
              </div>
              <div class="form-group">
                <label for="select-protocol">Protocol</label>
                <select id="select-protocol">
                  <option value="https" selected>HTTPS (SSL)</option>
                  <option value="http">HTTP</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <button id="btn-test-sweep" class="btn-secondary full-width">
                🔍 Sweep Local Subnet (e.g. 192.168.x.x)
              </button>
            </div>
          </div>
          <div class="modal-footer">
            <button id="btn-save-manual-ip" class="btn-primary full-width">
              Save & Connect
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
